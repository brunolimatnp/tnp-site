<style>
  :root{
    --petroleo:#15302E; --linho:#F3EFE6; --papel:#FAF8F3;
    --verde:#1F9B57; --verde-claro:#44E07A;
    --salvia:#5C7268; --grafite:#6E695E; --linha:#15302E1f;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --display:'Bricolage Grotesque','IBM Plex Sans',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--linho);color:var(--petroleo);font-family:var(--sans);
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
    text-align:center;
  }
  .card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}

  .simbolo{width:74px;margin-bottom:14px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,32px);line-height:1;letter-spacing:-.03em}
  .cargo{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--salvia);margin-top:9px}

  /* moldura de terminal em volta do QR */
  .janela{
    margin-top:22px;width:min(80vw,300px);background:#fff;
    border:1px solid var(--linha);border-radius:16px;overflow:hidden;
    box-shadow:0 2px 14px #15302e14;
  }
  .barra{display:flex;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid var(--linha)}
  .barra i{width:7px;height:7px;border-radius:50%;display:block}
  .barra i:nth-child(1){background:var(--verde-claro)}
  .barra i:nth-child(2){background:#F2A007}
  .barra i:nth-child(3){background:#C9C4B8}
  .barra span{margin-left:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--grafite);text-transform:uppercase}
  .qr{padding:14px}
  .qr svg{width:100%;height:auto;display:block}

  .destino{font-family:var(--mono);font-size:11.5px;color:var(--salvia);margin-top:14px;word-break:break-all;max-width:300px;min-height:17px}

  .modos{display:flex;gap:6px;margin-top:18px;width:min(90vw,340px)}
  .modos button{
    flex:1;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;cursor:pointer;border:1.5px solid var(--linha);
    background:transparent;color:var(--salvia);padding:11px 6px;border-radius:100px;min-height:44px;
  }
  .modos button.on{background:var(--petroleo);color:var(--linho);border-color:var(--petroleo)}

  .acoes{display:flex;gap:8px;margin-top:9px;width:min(90vw,340px)}
  .acoes button{
    flex:1;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--linha);background:transparent;color:var(--petroleo);
    padding:12px 8px;border-radius:100px;min-height:46px;
  }
  .acoes button:active{transform:translateY(1px)}

  .rodape{margin-top:26px}
  .tag{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
  .tag em{color:var(--verde);font-style:normal}
  .dica{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--grafite);margin-top:8px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <p class="destino" id="destino">tecnologianapratica.com.br/links</p>

  <div class="modos">
    <button data-m="card" class="on">Cartão</button>
    <button data-m="zap">WhatsApp</button>
    <button data-m="li">LinkedIn</button>
  </div>

  <div class="acoes">
    <button id="btShare">Enviar link</button>
    <button id="btCopy">Copiar</button>
  </div>

    <p class="tag">Simples <em>assim.</em></p>
    <p class="dica">aumente o brilho antes de mostrar</p>
  </div>

</main>

<script>
(function(){
  var M = {
    card: { url:'https://tecnologianapratica.com.br/links', txt:'tecnologianapratica.com.br/links', rot:'cartão completo' },
    zap:  { url:'https://wa.me/5511973943652',              txt:'wa.me/5511973943652',              rot:'whatsapp direto' },
    li:   { url:'https://www.linkedin.com/in/brunordosslima', txt:'linkedin.com/in/brunordosslima', rot:'linkedin' }
  };
  var atual = 'card';
  var destino = document.getElementById('destino');
  var rotulo  = document.getElementById('rotulo');
  var btCopy  = document.getElementById('btCopy');
  var btShare = document.getElementById('btShare');
  var botoes  = Array.prototype.slice.call(document.querySelectorAll('.modos button'));

  function trocar(m){
    atual = m;
    ['card','zap','li'].forEach(function(k){
      document.getElementById('q-'+k).style.display = (k===m) ? 'block' : 'none';
    });
    botoes.forEach(function(b){ b.classList.toggle('on', b.dataset.m===m); });
    destino.textContent = M[m].txt;
    rotulo.textContent  = M[m].rot;
    btCopy.textContent  = 'Copiar';
  }
  botoes.forEach(function(b){ b.addEventListener('click', function(){ trocar(b.dataset.m); }); });

  btCopy.addEventListener('click', function(){
    var ok = function(){ btCopy.textContent = 'Copiado ✓'; setTimeout(function(){ btCopy.textContent='Copiar'; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(M[atual].url).then(ok).catch(function(){ destino.textContent = M[atual].url; });
    } else { destino.textContent = M[atual].url; }
  });

  btShare.addEventListener('click', function(){
    if(navigator.share){
      navigator.share({ title:'Bruno Lima · Tecnologia na Prática', url:M[atual].url })
        .catch(function(){});
    } else {
      btCopy.click();
      btShare.textContent = 'Link copiado';
      setTimeout(function(){ btShare.textContent='Enviar link'; }, 1800);
    }
  });
})();
</script>
